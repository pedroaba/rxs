[package]
name = "rxs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Capturas de tela e anotações nativas, com baixo consumo de memória"
license = "MIT"
repository = "https://github.com/pedroaba/rxs"
readme = "README.md"
keywords = ["screenshot", "macos", "annotation", "appkit", "productivity"]
categories = ["gui", "multimedia::images"]

[dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSObject", "NSArray", "NSDictionary", "NSString", "NSData",
    "NSNotification", "NSProcessInfo", "NSUserDefaults", "NSURL", "NSGeometry", "NSError", "NSEnumerator",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics", "NSApplication",
    "NSResponder", "NSMenu", "NSMenuItem", "NSWindow", "NSView", "NSControl",
    "NSButton", "NSButtonCell", "NSCell", "NSTextField", "NSFont", "NSColor",
    "NSColorSpace", "NSSlider", "NSSliderCell", "NSActionCell", "NSPanel", "NSSavePanel",
    "NSScrollView", "NSClipView", "NSScroller", "NSSegmentedControl",
    "NSSegmentedCell", "NSPopUpButton", "NSPopUpButtonCell", "NSGraphics",
    "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSImage",
    "NSBezierPath", "NSCursor", "NSEvent", "NSStatusBar", "NSStatusItem",
    "NSAccessibility", "NSAccessibilityProtocols", "NSPopover", "NSViewController", "NSAppearance", "NSColorSampler", "block2",
    "NSStatusBarButton", "NSAlert", "NSPasteboard", "NSWorkspace", "NSRunningApplication",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGContext", "CGGeometry", "CGImage", "CGColorSpace", "CGDataProvider", "CGWindow",
] }
dispatch2 = "0.3.1"
global-hotkey = "0.7.0"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
